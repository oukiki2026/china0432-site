baseURL: "https://china0432.com/"
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
title: Visit Jilin City, China
paginate: 10
enableGitInfo: false
enableRobotsTXT: true   # 內建 robots.txt，可用 layouts/robots.txt 覆寫模板

# 圖片/樣式管線走 Hugo Pipes（需 extended 版）
# Sitemap：Hugo 內建生成（每語言自動生成，含 hreflang 對應 URL），
# 但用 layouts/_default/sitemap.xml 自訂模板剔除了 /tags/* 瘦標籤頁（2026-10-17 起）
# RSS：每語言自動生成（/index.xml 與 /zh-hant/index.xml）

languages:
  en:
    label: English
    languageCode: en
    contentDir: content/en
    title: Visit Jilin City, China
    weight: 1
    params:
      description: Travel guide to Jilin City, China — rime ice, heritage, local food and practical tips for international visitors.
      articleUnit: articles
  zh-hant:
    label: 繁體中文
    languageCode: zh-Hant
    contentDir: content/zh-hant
    title: 中國吉林市
    weight: 2
    params:
      description: 吉林文脈、尋味吉林、旅遊攻略——雙語家鄉文化站
      articleUnit: 篇文章

# 三個欄目（順序即導航順序；中英同為 heritage/taste/travel，缺失欄目自動隱藏）
params:
  # 預設文章署名（編輯部）：單篇文章可用 front matter `author:` 覆寫
  defaultAuthor: "Rita"
  # GA4 衡量 ID：填入 G-XXXXXXXXXX 后重新构建部署即生效（留空则不输出追踪代码）
  ga4measurementid: "G-NHT7JYNB2Y"
  # Umami Website ID：填入后重新构建部署即生效（留空则不输出追踪代码）
  umamiwebsiteid: "84382f7d-90ed-4ea8-a17c-acc7806da109"
  sections:
    - key: heritage
    - key: taste
    - key: travel

markup:
  goldmark:
    renderer:
      unsafe: false
